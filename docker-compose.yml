services:
  postgres:
    image: postgres:15-alpine
    container_name: healconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: healconnect
    ports:
      - "5432:5432"
    volumes:
      - healconnect-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healconnect"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: healconnect-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - healconnect-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  healconnect-postgres-data:
  healconnect-redis-data: