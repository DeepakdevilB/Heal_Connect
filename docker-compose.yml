services:
  postgres:
    image: postgres:15-alpine
    container_name: healconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: healconnect
    ports:
      - "5432:5432"
    volumes:
      - healconnect-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healconnect"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: healconnect-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - healconnect-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: healconnect-backend
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - DATABASE_URL=postgresql://postgres:test@postgres:5432/healconnect?schema=public
      - REDIS_URL=redis://redis:6379
      - PORT=8082
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: healconnect-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8082
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  healconnect-postgres-data:
  healconnect-redis-data: